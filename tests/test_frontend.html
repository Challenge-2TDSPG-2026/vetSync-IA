<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetSync - In-App Chat Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        .panel { flex: 1; display: flex; flex-direction: column; padding: 20px; border-right: 2px solid #ccc; }
        .panel h2 { text-align: center; color: #333; }
        .chat-box { flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        textarea { flex: 1; height: 50px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; font-family: inherit; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #128c7e; }
        .msg { max-width: 80%; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
        .msg.doctor { background: #dcf8c6; align-self: flex-end; }
        .msg.system { background: #eee; align-self: flex-start; border-left: 4px solid #075e54; font-size: 13px; }
        .msg.tutor { background: #dcf8c6; align-self: flex-end; }
        .msg.ia { background: #fff; align-self: flex-start; border: 1px solid #ddd; }
        .refresh-btn { background: #444; margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- PAINEL DO MÉDICO -->
<div class="panel">
    <h2>Visão do Médico</h2>
    <div class="chat-box" id="docChat">
        <div class="msg system"><strong>Sistema:</strong> Digite um comando. Ex: "Puxe o histórico do Rodrigo" ou "Mande uma mensagem marcando retorno em 15 dias"</div>
    </div>
    <div class="input-area">
        <textarea id="docInput" placeholder="Ex: Mande mensagem para ele marcando retorno em 15 dias"></textarea>
        <button onclick="sendDoctorCommand()">Enviar Comando</button>
    </div>
</div>

<!-- PAINEL DO TUTOR -->
<div class="panel">
    <h2>App do Tutor (In-App Chat)</h2>
    <button class="refresh-btn" onclick="loadTutorChat()">🔄 Recarregar Mensagens</button>
    <div class="chat-box" id="tutorChat">
    </div>
    <div class="input-area">
        <textarea id="tutorInput" placeholder="Responda à clínica... (Ex: Não posso nesse dia)"></textarea>
        <button onclick="sendTutorMessage()">Responder</button>
    </div>
</div>

<script>
    const TUTOR_ID = "rodrigo_123";

    async function sendDoctorCommand() {
        const input = document.getElementById('docInput');
        const text = input.value.trim();
        if(!text) return;
        
        appendMsg('docChat', text, 'doctor');
        input.value = '';

        try {
            const res = await fetch('http://localhost:8000/api/v1/in-app/doctor/comando', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comando: text, tutor_id: TUTOR_ID })
            });
            const data = await res.json();
            
            let systemReply = `Ação: ${data.ia_response.action}<br>`;
            if (data.ia_response.history_summary) systemReply += `<strong>Histórico:</strong> ${data.ia_response.history_summary}<br>`;
            if (data.ia_response.message_draft) systemReply += `<strong>Mensagem disparada p/ tutor:</strong> ${data.ia_response.message_draft}`;
            
            appendMsg('docChat', systemReply, 'system');
            
            // Recarrega o app do tutor pra simular notificação push
            setTimeout(loadTutorChat, 1000);
        } catch(e) {
            appendMsg('docChat', 'Erro: ' + e.message, 'system');
        }
    }

    async function sendTutorMessage() {
        const input = document.getElementById('tutorInput');
        const text = input.value.trim();
        if(!text) return;

        appendMsg('tutorChat', text, 'tutor');
        input.value = '';

        try {
            const res = await fetch('http://localhost:8000/api/v1/in-app/chat/tutor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: text, tutor_id: TUTOR_ID })
            });
            setTimeout(loadTutorChat, 500); // Reload chat
        } catch(e) {
            appendMsg('tutorChat', 'Erro de conexão.', 'ia');
        }
    }

    async function loadTutorChat() {
        try {
            const res = await fetch(`http://localhost:8000/api/v1/in-app/chat/${TUTOR_ID}`);
            const data = await res.json();
            const chatBox = document.getElementById('tutorChat');
            chatBox.innerHTML = '';
            data.mensagens.forEach(msg => {
                const cls = msg.remetente === 'TUTOR' ? 'tutor' : 'ia';
                appendMsg('tutorChat', msg.texto, cls);
            });
        } catch(e) {
            console.error(e);
        }
    }

    function appendMsg(boxId, html, className) {
        const box = document.getElementById(boxId);
        const div = document.createElement('div');
        div.className = `msg ${className}`;
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // Inicializa carregando o chat vazio do tutor
    loadTutorChat();
</script>

</body>
</html>
